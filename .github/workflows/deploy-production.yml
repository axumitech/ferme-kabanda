name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ferme-kabanda-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    # ============================================================
    # Environnement uniquement utilisé sur le runner GitHub.
    # Ce ne sont PAS les variables du serveur Hostking.
    # ============================================================
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost

      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log

    steps:
      # ==========================================================
      # 1. Récupération du repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. PHP + Composer
      #
      # Wayfinder exécute php artisan pendant le build Vite.
      # Laravel doit donc être fonctionnel AVANT npm run build.
      # ==========================================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, curl, xml, ctype, fileinfo
          tools: composer:v2
          coverage: none

      # ==========================================================
      # 3. Préparer l'environnement Laravel du runner CI
      #
      # Ce .env est temporaire et disparaît avec le runner.
      # Il ne touche PAS au .env Hostking.
      # ==========================================================
      - name: Prepare Laravel CI environment
        run: |
          if [ ! -f ".env.example" ]; then
            echo "ERROR: .env.example does not exist"
            exit 1
          fi

          cp .env.example .env

          mkdir -p database
          touch database/database.sqlite

          echo "Laravel CI environment prepared"

      # ==========================================================
      # 4. Installer les dépendances PHP
      #
      # Pas de --no-dev ici :
      # le runner GitHub est un environnement de build.
      # ==========================================================
      - name: Install PHP dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      # ==========================================================
      # 5. Générer une APP_KEY temporaire
      # ==========================================================
      - name: Generate CI application key
        run: php artisan key:generate --force

      # ==========================================================
      # 6. Vérifier Laravel
      # ==========================================================
      - name: Verify Laravel
        run: |
          php -v
          composer --version
          php artisan --version

          php artisan optimize:clear
          php artisan route:clear

          echo "Laravel bootstrap OK"

      # ==========================================================
      # 7. Vérifier Wayfinder explicitement
      #
      # Si Wayfinder échoue, on aura une erreur claire ici
      # avant d'arriver au build Vite.
      # ==========================================================
      - name: Generate Wayfinder types
        run: |
          php artisan wayfinder:generate --with-form

          echo "Wayfinder generation OK"

      # ==========================================================
      # 8. Node.js
      #
      # Node n'est pas installé sur Hostking.
      # Le frontend est donc compilé ici.
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # ==========================================================
      # 9. Installer les dépendances frontend
      # ==========================================================
      - name: Install frontend dependencies
        run: npm ci

      # ==========================================================
      # 10. Build Vite / React
      # ==========================================================
      - name: Build frontend
        run: npm run build

      # ==========================================================
      # 11. Vérifier le build
      # ==========================================================
      - name: Verify frontend build
        run: |
          if [ ! -d "public/build" ]; then
            echo "ERROR: public/build does not exist"
            exit 1
          fi

          if [ ! -f "public/build/manifest.json" ]; then
            echo "ERROR: public/build/manifest.json does not exist"
            exit 1
          fi

          echo "Frontend build OK"

      # ==========================================================
      # 12. Préparer les fichiers publics
      #
      # IMPORTANT :
      #
      # public/index.php est volontairement exclu.
      #
      # Le index.php de Hostking contient des chemins spécifiques
      # vers :
      #
      # /home/zwswegws/ferme-kabanda
      #
      # Il ne doit jamais être écrasé par GitHub.
      # ==========================================================
      - name: Package public assets
        run: |
          tar \
            --exclude='./index.php' \
            -czf /tmp/ferme-kabanda-public.tar.gz \
            -C public .

          echo "Public assets packaged"

          ls -lh /tmp/ferme-kabanda-public.tar.gz

      # ==========================================================
      # 13. Configurer SSH GitHub -> Hostking
      # ==========================================================
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTKING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTKING_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration created"

      # ==========================================================
      # 14. Tester GitHub -> Hostking
      # ==========================================================
      - name: Test SSH connection
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -p "$PORT" \
            "$USER@$HOST" \
            'echo "SSH connection successful"; whoami; pwd'

      # ==========================================================
      # 15. Envoyer les assets compilés vers Hostking
      # ==========================================================
      - name: Upload public assets
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -P "$PORT" \
            /tmp/ferme-kabanda-public.tar.gz \
            "$USER@$HOST:/home/zwswegws/ferme-kabanda-public-${GITHUB_SHA}.tar.gz"

          echo "Public assets uploaded"

      # ==========================================================
      # 16. Déploiement Laravel sur Hostking
      # ==========================================================
      - name: Deploy Laravel
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -p "$PORT" \
            "$USER@$HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          # ======================================================
          # Configuration Hostking
          # ======================================================

          APP_DIR="/home/zwswegws/ferme-kabanda"

          PUBLIC_DIR="/home/zwswegws/domains/fermekabandanaweza.com/public_html"

          ARCHIVE="/home/zwswegws/ferme-kabanda-public-${DEPLOY_SHA}.tar.gz"

          STAGING_ROOT="/home/zwswegws/.deploy"

          STAGING_DIR="${STAGING_ROOT}/ferme-kabanda-${DEPLOY_SHA}"

          echo ""
          echo "============================================"
          echo " FERME KABANDA - PRODUCTION DEPLOYMENT"
          echo " Commit: ${DEPLOY_SHA}"
          echo "============================================"
          echo ""

          mkdir -p "$STAGING_ROOT"

          cd "$APP_DIR"

          # ======================================================
          # Cleanup automatique
          #
          # Même en cas d'échec :
          # - suppression fichiers temporaires
          # - tentative de sortie du mode maintenance
          # ======================================================

          cleanup() {
              EXIT_CODE=$?

              echo ""
              echo "Cleaning deployment temporary files..."

              rm -rf "$STAGING_DIR"
              rm -f "$ARCHIVE"

              php artisan up >/dev/null 2>&1 || true

              if [ "$EXIT_CODE" -ne 0 ]; then
                  echo ""
                  echo "============================================"
                  echo " DEPLOYMENT FAILED"
                  echo " Exit code: $EXIT_CODE"
                  echo "============================================"
              fi
          }

          trap cleanup EXIT

          # ======================================================
          # Vérifications production
          # ======================================================

          echo "Checking production environment..."

          if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: application directory does not exist"
              exit 1
          fi

          if [ ! -d "$PUBLIC_DIR" ]; then
              echo "ERROR: public_html directory does not exist"
              exit 1
          fi

          if [ ! -f ".env" ]; then
              echo "ERROR: production .env is missing"
              exit 1
          fi

          if [ ! -f "artisan" ]; then
              echo "ERROR: artisan is missing"
              exit 1
          fi

          if [ ! -f "composer.json" ]; then
              echo "ERROR: composer.json is missing"
              exit 1
          fi

          if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: frontend archive is missing"
              exit 1
          fi

          echo "Production environment OK"

          # ======================================================
          # Git
          #
          # Hostking -> GitHub utilise la Deploy Key déjà créée.
          # ======================================================

          echo ""
          echo "Fetching GitHub repository..."

          git fetch --prune origin main

          echo ""
          echo "Switching production to exact commit:"
          echo "${DEPLOY_SHA}"

          git reset --hard "$DEPLOY_SHA"

          # ======================================================
          # Maintenance Laravel
          # ======================================================

          echo ""
          echo "Enabling Laravel maintenance mode..."

          php artisan down --retry=60 || true

          # ======================================================
          # Composer production
          #
          # Ici --no-dev est volontaire.
          # ======================================================

          echo ""
          echo "Installing production Composer dependencies..."

          composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --no-progress \
              --optimize-autoloader

          # ======================================================
          # Cache Laravel
          # ======================================================

          echo ""
          echo "Clearing Laravel caches..."

          php artisan optimize:clear

          # ======================================================
          # Migrations
          # ======================================================

          echo ""
          echo "Running database migrations..."

          php artisan migrate --force

          # ======================================================
          # Extraction des assets générés sur GitHub
          # ======================================================

          echo ""
          echo "Preparing public assets..."

          rm -rf "$STAGING_DIR"

          mkdir -p "$STAGING_DIR"

          tar -xzf "$ARCHIVE" -C "$STAGING_DIR"

          if [ ! -f "$STAGING_DIR/build/manifest.json" ]; then
              echo "ERROR: Vite manifest not found after extraction"
              exit 1
          fi

          echo "Vite manifest verified"

          # ======================================================
          # Déploiement atomique de public/build
          #
          # On prépare le nouveau build avant de retirer l'ancien.
          # ======================================================

          echo ""
          echo "Deploying Vite build..."

          NEW_BUILD="$PUBLIC_DIR/.build-${DEPLOY_SHA}"
          OLD_BUILD="$PUBLIC_DIR/.build-previous"

          rm -rf "$NEW_BUILD"
          rm -rf "$OLD_BUILD"

          mv "$STAGING_DIR/build" "$NEW_BUILD"

          if [ -d "$PUBLIC_DIR/build" ]; then
              mv "$PUBLIC_DIR/build" "$OLD_BUILD"
          fi

          mv "$NEW_BUILD" "$PUBLIC_DIR/build"

          rm -rf "$OLD_BUILD"

          echo "Vite build deployed"

          # ======================================================
          # Synchroniser les autres fichiers publics
          #
          # index.php a été exclu de l'archive.
          #
          # Le index.php spécifique Hostking reste donc intact.
          # ======================================================

          echo ""
          echo "Synchronizing other public files..."

          cp -a "$STAGING_DIR/." "$PUBLIC_DIR/"

          # ======================================================
          # Permissions Laravel
          # ======================================================

          echo ""
          echo "Updating Laravel permissions..."

          chmod -R 775 storage bootstrap/cache || true

          # ======================================================
          # Cache production
          # ======================================================

          echo ""
          echo "Building production caches..."

          php artisan config:cache
          php artisan view:cache

          # ======================================================
          # Remise en ligne
          # ======================================================

          echo ""
          echo "Disabling maintenance mode..."

          php artisan up

          # ======================================================
          # Nettoyage
          # ======================================================

          echo ""
          echo "Cleaning deployment files..."

          rm -rf "$STAGING_DIR"
          rm -f "$ARCHIVE"

          trap - EXIT

          echo ""
          echo "============================================"
          echo " DEPLOYMENT SUCCESSFUL"
          echo " Commit: ${DEPLOY_SHA}"
          echo "============================================"
          echo ""

          REMOTE_SCRIPT