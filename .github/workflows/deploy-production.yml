name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ferme-kabanda-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Node
      #
      # Hostking n'a pas Node.
      # Le build frontend est donc réalisé ici.
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ==========================================================
      # 3. Frontend dependencies
      # ==========================================================
      - name: Install frontend dependencies
        run: npm ci

      # ==========================================================
      # 4. Build Vite / React
      # ==========================================================
      - name: Build frontend
        run: npm run build

      # ==========================================================
      # 5. Vérifier le build
      # ==========================================================
      - name: Verify frontend build
        run: |
          if [ ! -d "public/build" ]; then
            echo "ERROR: public/build does not exist"
            exit 1
          fi

          if [ ! -f "public/build/manifest.json" ]; then
            echo "ERROR: public/build/manifest.json does not exist"
            exit 1
          fi

          echo "Frontend build OK"

      # ==========================================================
      # 6. Préparer les fichiers publics
      #
      # IMPORTANT :
      # public/index.php est exclu.
      #
      # Le public_html/index.php du serveur contient des chemins
      # spécifiques vers :
      #
      # /home/zwswegws/ferme-kabanda
      # ==========================================================
      - name: Package public assets
        run: |
          tar \
            --exclude='./index.php' \
            -czf /tmp/ferme-kabanda-public.tar.gz \
            -C public .

          echo "Public assets packaged"

      # ==========================================================
      # 7. Configurer SSH GitHub -> Hostking
      # ==========================================================
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTKING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTKING_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ==========================================================
      # 8. Tester SSH
      # ==========================================================
      - name: Test SSH connection
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            'echo "SSH connection successful"; whoami; pwd'

      # ==========================================================
      # 9. Upload build Vite
      # ==========================================================
      - name: Upload public assets
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -P "$PORT" \
            /tmp/ferme-kabanda-public.tar.gz \
            "$USER@$HOST:/home/zwswegws/ferme-kabanda-public-${GITHUB_SHA}.tar.gz"

      # ==========================================================
      # 10. Déploiement
      # ==========================================================
      - name: Deploy Laravel
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          APP_DIR="/home/zwswegws/ferme-kabanda"
          PUBLIC_DIR="/home/zwswegws/domains/fermekabandanaweza.com/public_html"

          ARCHIVE="/home/zwswegws/ferme-kabanda-public-${DEPLOY_SHA}.tar.gz"

          STAGING_ROOT="/home/zwswegws/.deploy"
          STAGING_DIR="${STAGING_ROOT}/ferme-kabanda-${DEPLOY_SHA}"

          echo ""
          echo "============================================"
          echo " FERME KABANDA - PRODUCTION DEPLOYMENT"
          echo " Commit: ${DEPLOY_SHA}"
          echo "============================================"
          echo ""

          mkdir -p "$STAGING_ROOT"

          cd "$APP_DIR"

          # ------------------------------------------------------
          # Nettoyage automatique en cas d'erreur
          # ------------------------------------------------------
          cleanup() {
              EXIT_CODE=$?

              echo ""
              echo "Cleaning deployment temporary files..."

              rm -rf "$STAGING_DIR"
              rm -f "$ARCHIVE"

              # Toujours essayer de remettre Laravel en ligne
              php artisan up >/dev/null 2>&1 || true

              if [ "$EXIT_CODE" -ne 0 ]; then
                  echo ""
                  echo "DEPLOYMENT FAILED"
                  echo "Exit code: $EXIT_CODE"
              fi
          }

          trap cleanup EXIT

          # ------------------------------------------------------
          # Vérifications serveur
          # ------------------------------------------------------
          echo "Checking production environment..."

          if [ ! -f ".env" ]; then
              echo "ERROR: production .env is missing"
              exit 1
          fi

          if [ ! -f "artisan" ]; then
              echo "ERROR: artisan is missing"
              exit 1
          fi

          if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: frontend archive is missing"
              exit 1
          fi

          # ------------------------------------------------------
          # Git
          # ------------------------------------------------------
          echo ""
          echo "Fetching GitHub repository..."

          git fetch --prune origin main

          echo "Switching to commit ${DEPLOY_SHA}..."

          git reset --hard "$DEPLOY_SHA"

          # ------------------------------------------------------
          # Maintenance
          # ------------------------------------------------------
          echo ""
          echo "Enabling Laravel maintenance mode..."

          php artisan down --retry=60 || true

          # ------------------------------------------------------
          # Composer
          # ------------------------------------------------------
          echo ""
          echo "Installing Composer production dependencies..."

          composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --no-progress \
              --optimize-autoloader

          # ------------------------------------------------------
          # Cache
          # ------------------------------------------------------
          echo ""
          echo "Clearing Laravel caches..."

          php artisan optimize:clear

          # ------------------------------------------------------
          # Database
          # ------------------------------------------------------
          echo ""
          echo "Running database migrations..."

          php artisan migrate --force

          # ------------------------------------------------------
          # Extract frontend build
          # ------------------------------------------------------
          echo ""
          echo "Preparing public assets..."

          rm -rf "$STAGING_DIR"

          mkdir -p "$STAGING_DIR"

          tar -xzf "$ARCHIVE" -C "$STAGING_DIR"

          if [ ! -f "$STAGING_DIR/build/manifest.json" ]; then
              echo "ERROR: Vite manifest not found after extraction"
              exit 1
          fi

          # ------------------------------------------------------
          # Déploiement atomique du build Vite
          # ------------------------------------------------------
          echo ""
          echo "Deploying Vite build..."

          NEW_BUILD="$PUBLIC_DIR/.build-${DEPLOY_SHA}"
          OLD_BUILD="$PUBLIC_DIR/.build-previous"

          rm -rf "$NEW_BUILD"
          rm -rf "$OLD_BUILD"

          mv "$STAGING_DIR/build" "$NEW_BUILD"

          if [ -d "$PUBLIC_DIR/build" ]; then
              mv "$PUBLIC_DIR/build" "$OLD_BUILD"
          fi

          mv "$NEW_BUILD" "$PUBLIC_DIR/build"

          rm -rf "$OLD_BUILD"

          # ------------------------------------------------------
          # Synchroniser les autres fichiers publics
          #
          # index.php n'existe pas dans STAGING_DIR
          # donc celui de Hostking est conservé.
          # ------------------------------------------------------
          echo ""
          echo "Synchronizing other public files..."

          cp -a "$STAGING_DIR/." "$PUBLIC_DIR/"

          # ------------------------------------------------------
          # Production caches
          # ------------------------------------------------------
          echo ""
          echo "Building production caches..."

          php artisan config:cache
          php artisan view:cache

          # ------------------------------------------------------
          # Permissions
          # ------------------------------------------------------
          chmod -R 775 storage bootstrap/cache || true

          # ------------------------------------------------------
          # Application UP
          # ------------------------------------------------------
          echo ""
          echo "Disabling maintenance mode..."

          php artisan up

          # ------------------------------------------------------
          # Cleanup
          # ------------------------------------------------------
          rm -rf "$STAGING_DIR"
          rm -f "$ARCHIVE"

          trap - EXIT

          echo ""
          echo "============================================"
          echo " DEPLOYMENT SUCCESSFUL"
          echo " Commit: ${DEPLOY_SHA}"
          echo "============================================"
          echo ""

          REMOTE_SCRIPT
