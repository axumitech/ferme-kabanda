name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ferme-kabanda-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost

      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log

    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. PHP + Composer
      # ==========================================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, curl, xml, ctype, fileinfo
          tools: composer:v2
          coverage: none

      # ==========================================================
      # 3. Laravel CI environment
      # ==========================================================
      - name: Prepare Laravel CI environment
        run: |
          set -euo pipefail

          cp .env.example .env

          mkdir -p database
          touch database/database.sqlite

      # ==========================================================
      # 4. PHP dependencies
      # ==========================================================
      - name: Install PHP dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      # ==========================================================
      # 5. APP KEY
      # ==========================================================
      - name: Generate CI application key
        run: php artisan key:generate --force

      # ==========================================================
      # 6. Laravel verification
      # ==========================================================
      - name: Verify Laravel
        run: |
          set -euo pipefail

          php -v
          composer --version
          php artisan --version

          php artisan optimize:clear
          php artisan route:clear

      # ==========================================================
      # 7. Wayfinder
      # ==========================================================
      - name: Generate Wayfinder types
        run: |
          php artisan wayfinder:generate --with-form

      # ==========================================================
      # 8. Node
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # ==========================================================
      # 9. NPM dependencies
      # ==========================================================
      - name: Install frontend dependencies
        run: npm ci

      # ==========================================================
      # 10. Vite build
      # ==========================================================
      - name: Build frontend
        run: npm run build

      # ==========================================================
      # 11. Verify build
      # ==========================================================
      - name: Verify frontend build
        run: |
          set -euo pipefail

          test -d public/build
          test -f public/build/manifest.json

          echo "Frontend build OK"

      # ==========================================================
      # 12. Package public files
      #
      # index.php is excluded because Hostking uses
      # a custom index.php pointing to:
      # /home/zwswegws/ferme-kabanda
      # ==========================================================
      - name: Package public assets
        run: |
          set -euo pipefail

          tar \
            --exclude='./index.php' \
            -czf /tmp/ferme-kabanda-public.tar.gz \
            -C public .

          ls -lh /tmp/ferme-kabanda-public.tar.gz

      # ==========================================================
      # 13. Configure SSH
      #
      # Required secrets:
      #
      # HOSTKING_HOST
      # HOSTKING_PORT
      # HOSTKING_USER
      # HOSTKING_SSH_KEY
      # HOSTKING_HOST_FINGERPRINT
      # ==========================================================
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTKING_SSH_KEY }}
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          EXPECTED_FINGERPRINT: ${{ secrets.HOSTKING_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keyscan \
            -t ed25519 \
            -p "$PORT" \
            "$HOST" \
            2>/dev/null > "$HOME/.ssh/known_hosts_candidate"

          if [ ! -s "$HOME/.ssh/known_hosts_candidate" ]; then
            echo "ERROR: Unable to retrieve Hostking SSH host key"
            exit 1
          fi

          ACTUAL_FINGERPRINT="$(
            ssh-keygen \
              -lf "$HOME/.ssh/known_hosts_candidate" \
              -E sha256 |
            awk '{print $2}'
          )"

          echo "Expected fingerprint: $EXPECTED_FINGERPRINT"
          echo "Actual fingerprint:   $ACTUAL_FINGERPRINT"

          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "ERROR: Hostking SSH fingerprint mismatch"
            exit 1
          fi

          mv \
            "$HOME/.ssh/known_hosts_candidate" \
            "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configuration ready"

      # ==========================================================
      # 14. Test SSH
      # ==========================================================
      - name: Test SSH connection
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -p "$PORT" \
            "$USER@$HOST" \
            'echo "SSH connection successful"; whoami; pwd'

      # ==========================================================
      # 15. Upload build
      # ==========================================================
      - name: Upload public assets
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          set -euo pipefail

          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -P "$PORT" \
            /tmp/ferme-kabanda-public.tar.gz \
            "$USER@$HOST:/home/zwswegws/ferme-kabanda-public-${GITHUB_SHA}.tar.gz"

      # ==========================================================
      # 16. Deploy Laravel
      # ==========================================================
      - name: Deploy Laravel
        env:
          HOST: ${{ secrets.HOSTKING_HOST }}
          PORT: ${{ secrets.HOSTKING_PORT }}
          USER: ${{ secrets.HOSTKING_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -p "$PORT" \
            "$USER@$HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          APP_DIR="/home/zwswegws/ferme-kabanda"

          PUBLIC_DIR="/home/zwswegws/domains/fermekabandanaweza.com/public_html"

          ARCHIVE="/home/zwswegws/ferme-kabanda-public-${DEPLOY_SHA}.tar.gz"

          STAGING_ROOT="/home/zwswegws/.deploy"

          STAGING_DIR="${STAGING_ROOT}/ferme-kabanda-${DEPLOY_SHA}"

          echo ""
          echo "============================================"
          echo " FERME KABANDA - PRODUCTION DEPLOYMENT"
          echo " Commit: ${DEPLOY_SHA}"
          echo "============================================"
          echo ""

          mkdir -p "$STAGING_ROOT"

          cd "$APP_DIR"

          # ======================================================
          # Automatic cleanup
          # ======================================================

          cleanup() {
              EXIT_CODE=$?

              echo ""
              echo "Cleaning deployment temporary files..."

              rm -rf "$STAGING_DIR"
              rm -f "$ARCHIVE"

              php artisan up >/dev/null 2>&1 || true

              if [ "$EXIT_CODE" -ne 0 ]; then
                  echo ""
                  echo "============================================"
                  echo " DEPLOYMENT FAILED"
                  echo " Exit code: $EXIT_CODE"
                  echo "============================================"
              fi
          }

          trap cleanup EXIT

          # ======================================================
          # Validate server
          # ======================================================

          echo "Checking production environment..."

          if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: application directory does not exist"
              exit 1
          fi

          if [ ! -d "$PUBLIC_DIR" ]; then
              echo "ERROR: public_html directory does not exist"
              exit 1
          fi

          if [ ! -f ".env" ]; then
              echo "ERROR: production .env is missing"
              exit 1
          fi

          if [ ! -f "artisan" ]; then
              echo "ERROR: artisan is missing"
              exit 1
          fi

          if [ ! -f "composer.json" ]; then
              echo "ERROR: composer.json is missing"
              exit 1
          fi

          if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: frontend archive is missing"
              exit 1
          fi

          echo "Production environment OK"

          # ======================================================
          # Git
          # ======================================================

          echo ""
          echo "Fetching GitHub repository..."

          git fetch --prune origin main

          echo ""
          echo "Deploying commit:"
          echo "$DEPLOY_SHA"

          git reset --hard "$DEPLOY_SHA"

          # ======================================================
          # Maintenance
          # ======================================================

          echo ""
          echo "Enabling Laravel maintenance mode..."

          php artisan down --retry=60 || true

          # ======================================================
          # Composer
          # ======================================================

          echo ""
          echo "Installing production dependencies..."

          composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --no-progress \
              --optimize-autoloader

          # ======================================================
          # Laravel cache
          # ======================================================

          echo ""
          echo "Clearing Laravel caches..."

          php artisan optimize:clear

          # ======================================================
          # Database
          # ======================================================

          echo ""
          echo "Running migrations..."

          php artisan migrate --force

          # ======================================================
          # Extract GitHub frontend build
          # ======================================================

          echo ""
          echo "Preparing public assets..."

          rm -rf "$STAGING_DIR"

          mkdir -p "$STAGING_DIR"

          tar -xzf "$ARCHIVE" -C "$STAGING_DIR"

          if [ ! -f "$STAGING_DIR/build/manifest.json" ]; then
              echo "ERROR: Vite manifest not found after extraction"
              exit 1
          fi

          # ======================================================
          # Atomic Vite deployment
          # ======================================================

          echo ""
          echo "Deploying Vite build..."

          NEW_BUILD="$PUBLIC_DIR/.build-${DEPLOY_SHA}"
          OLD_BUILD="$PUBLIC_DIR/.build-previous"

          rm -rf "$NEW_BUILD"
          rm -rf "$OLD_BUILD"

          mv "$STAGING_DIR/build" "$NEW_BUILD"

          if [ -d "$PUBLIC_DIR/build" ]; then
              mv "$PUBLIC_DIR/build" "$OLD_BUILD"
          fi

          mv "$NEW_BUILD" "$PUBLIC_DIR/build"

          rm -rf "$OLD_BUILD"

          # ======================================================
          # Sync other public files
          #
          # index.php is not included in the archive.
          # ======================================================

          echo ""
          echo "Synchronizing public files..."

          cp -a "$STAGING_DIR/." "$PUBLIC_DIR/"

          # ======================================================
          # Permissions
          # ======================================================

          echo ""
          echo "Updating permissions..."

          chmod -R 775 storage bootstrap/cache || true

          # ======================================================
          # Production caches
          # ======================================================

          echo ""
          echo "Building production caches..."

          php artisan config:cache
          php artisan view:cache

          # ======================================================
          # Application up
          # ======================================================

          echo ""
          echo "Disabling maintenance mode..."

          php artisan up

          # ======================================================
          # Cleanup
          # ======================================================

          echo ""
          echo "Cleaning deployment files..."

          rm -rf "$STAGING_DIR"
          rm -f "$ARCHIVE"

          trap - EXIT

          echo ""
          echo "============================================"
          echo " DEPLOYMENT SUCCESSFUL"
          echo " Commit: ${DEPLOY_SHA}"
          echo "============================================"
          echo ""

          REMOTE_SCRIPT