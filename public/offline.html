<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hors ligne — Ferme Kabanda Naweza</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #f7f6f2;
                color: #17352a;
                font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            main {
                width: min(92vw, 520px);
                border: 1px solid #ded8ca;
                border-radius: 22px;
                background: white;
                padding: 28px;
                box-shadow: 0 20px 70px rgba(23, 53, 42, .12);
            }
            img { width: 54px; height: 54px; object-fit: contain; }
            h1 { margin: 18px 0 8px; font-size: 26px; }
            p { line-height: 1.6; color: #637069; }
            a {
                display: inline-flex;
                margin-top: 16px;
                padding: 12px 16px;
                border-radius: 12px;
                background: #174a31;
                color: white;
                text-decoration: none;
                font-weight: 700;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/brand-logo.png" alt="Ferme Kabanda Naweza">
            <h1>Vous êtes hors ligne</h1>
            <p>
                Les écrans protégés ne sont pas conservés hors ligne afin de protéger les données de l’équipe.
                Dès que le réseau revient, vous pourrez rouvrir l’application et synchroniser vos saisies en attente.
            </p>
            <a href="/dashboard">Réessayer</a>
        </main>
    </body>
</html>
